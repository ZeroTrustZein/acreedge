[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acreedge"
version = "0.1.0"
description = "AcreEdge: Autonomous Multi-Agent Underwriting Engine, Valuation MCP Server, and Municipal Deed Ingestion Pipeline with Hybrid pgvector/Graph-RAG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zein" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "typing_extensions>=4.8.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "build>=1.0.0",
]

[project.scripts]
acreedge = "acreedge.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["acreedge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
